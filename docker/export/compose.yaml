# Serves a game library exported as a static binary cache, on a host without Nix, e.g.
# a NAS. The folder holds the cache and games.json (see the README, "Serving the library
# with Docker").
#
# Usage: LANOS_CACHE=/path/to/export docker compose up -d
#   LANOS_PORT  port the sticks use (default 5000, as in the group's library.url)
services:
  library:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${LANOS_PORT:-5000}:80"
    volumes:
      - "${LANOS_CACHE:?set LANOS_CACHE to the exported library}:/srv/lanos-cache:ro"
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
